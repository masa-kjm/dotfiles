schema_version: 3
id: base

resources:
  git-config:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: features/git/files/gitconfig.linux
      target: ~/.gitconfig
      operation: link
  
  gitignore:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: features/git/files/ignore
      target: ~/.config/git/ignore
      operation: link

  lazygit:
    type: file
    properties:
      kind: directory
      source:
        store: dotfiles
        path: features/git-tools/files/lazygit
      target: ~/.config/lazygit
      operation: link

  nvim:
    type: file
    properties:
      kind: directory
      source:
        store: dotfiles
        path: features/neovim/files/nvim
      target: ~/.config/nvim
      operation: link
