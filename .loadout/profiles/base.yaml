schema_version: 5
id: base

resources:
  git-config:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/git/gitconfig.linux
      target: ~/.gitconfig
      operation: link
  gitignore:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/git/ignore
      target: ~/.config/git/ignore
      operation: link

  lazygit:
    type: file
    properties:
      kind: directory
      source:
        store: dotfiles
        path: resources/git-tools/lazygit
      target: ~/.config/lazygit
      operation: link

  nvim:
    type: file
    properties:
      kind: directory
      source:
        store: dotfiles
        path: resources/neovim/nvim
      target: ~/.config/nvim
      operation: link
