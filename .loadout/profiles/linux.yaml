schema_version: 3
id: linux

includes:
  - id: base
  - id: shell

resources:
  homebrew:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: features/brew/files/Brewfile
      target: ~/.homebrew/Brewfile
      operation: link

  mise:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: features/mise/files/config.toml
      target: ~/.config/mise/config.toml
      operation: link
