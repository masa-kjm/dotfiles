schema_version: 5
id: linux

includes:
  - id: shell
  - id: brew
  - id: mise
    with:
      source-path: resources/mise/config.toml
      target-path: ~/.config/mise/config.toml
      operation: link
  - id: git
    with:
      gitconfig-source-path: resources/git/gitconfig.linux
      gitconfig-target-path: ~/.gitconfig
      gitconfig-operation: link
      gitignore-source-path: resources/git/ignore
      gitignore-target-path: ~/.config/git/ignore
      gitignore-operation: link
  - id: neovim
    with:
      target-path: ~/.config/nvim
      operation: link
  - id: tools-git
    with:
      source-path: resources/git-tools/lazygit
      target-path: ~/.config/lazygit
      operation: link

resources: {}
