schema_version: 5
id: git

resources:
  git-config:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/git/gitconfig.linux
      target: ~/.gitconfig
      operation: link
  gitignore:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/git/ignore
      target: ~/.config/git/ignore
      operation: link
