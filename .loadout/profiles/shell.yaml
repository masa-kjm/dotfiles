schema_version: 5
id: shell

resources:
  bashrc:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/bash/.bashrc
      target: ~/.bashrc
      operation: link
  bashrcd:
    type: file
    properties:
      kind: directory
      source:
        store: dotfiles
        path: resources/bash/.bashrc.d
      target: ~/.bashrc.d
      operation: link

  tmux:
    type: file
    properties:
      kind: file
      source:
        store: dotfiles
        path: resources/tmux/.tmux.conf
      target: ~/.tmux.conf
      operation: link
