description: npm global packages for Node.js development
depends:
  - node
packages:
  - name: typescript
  - name: typescript-language-server
  - name: eslint
  # Required by Neovim (nvim/after/lsp/eslint.lua)
  - name: vscode-langservers-extracted
  # Required by Neovim (nvim/after/lsp/copilot.lua, vim.lsp.inline_completion)
  - name: "@github/copilot-language-server"
