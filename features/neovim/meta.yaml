description: Neovim text editor with custom configuration
depends:
  - git

requires:
  - name: package_manager
  - name: runtime_manager

packages:
  # neovim binary is not uninstalled on feature remove (may be used independently)
  - name: neovim
    managed: false

runtimes:
  # Required by nvim-treesitter (main branch) to build parsers. A C compiler is also required.
  - name: tree-sitter
    version: "0.27.2"

files:
  - src: nvim
    target: ~/.config/nvim
    op: link
